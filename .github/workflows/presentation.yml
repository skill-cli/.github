name: Shared presentation check

on:
  workflow_call:
    inputs:
      runner:
        description: Runner matching the OS that built the executable
        type: string
        default: ubuntu-24.04
      executable-artifact:
        description: Name of the caller's uploaded executable artifact
        type: string
        default: ''
      executable-path:
        description: Relative path of the executable inside the artifact
        type: string
        default: ''
      assets:
        description: Asset root relative to the caller checkout
        type: string
        default: .github/assets

permissions:
  contents: read

concurrency:
  group: shared-presentation-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  presentation:
    name: presentation
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - name: Validate workflow revision
        env:
          STANDARD_SHA: ${{ job.workflow_sha }}
        run: |
          if [[ ! "$STANDARD_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "::error::GitHub did not provide the reusable workflow commit SHA"
            exit 1
          fi
      - name: Check out caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: caller
          persist-credentials: false
      - name: Check out pinned standard
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: skill-cli/.github
          ref: ${{ job.workflow_sha }}
          path: standard
          persist-credentials: false
      - name: Resolve inputs
        id: inputs
        working-directory: standard
        env:
          CALLER_REPOSITORY: ${{ github.repository }}
          ASSETS: ${{ inputs.assets }}
          EXECUTABLE_ARTIFACT: ${{ inputs.executable-artifact }}
          EXECUTABLE_PATH: ${{ inputs.executable-path }}
        run: |
          python3 Scripts/presentation-inputs.py --repository "$CALLER_REPOSITORY" \
            --assets "$ASSETS" --executable-artifact "$EXECUTABLE_ARTIFACT" \
            --executable-path "$EXECUTABLE_PATH"
      - name: Download executable
        if: ${{ steps.inputs.outputs.kind == 'tool' }}
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.executable-artifact }}
          path: ${{ runner.temp }}/executable
      - name: Prepare executable
        if: ${{ steps.inputs.outputs.kind == 'tool' }}
        env:
          EXECUTABLE_PATH: ${{ inputs.executable-path }}
        run: |
          if [[ -z "$EXECUTABLE_PATH" || "$EXECUTABLE_PATH" == /* || "$EXECUTABLE_PATH" == *..* ]]; then
            echo "::error::executable-path must be relative and cannot contain .."
            exit 1
          fi
          if [[ ! -f "$RUNNER_TEMP/executable/$EXECUTABLE_PATH" ]]; then
            echo "::error::executable-path must name a file in the executable artifact"
            exit 1
          fi
          chmod +x "$RUNNER_TEMP/executable/$EXECUTABLE_PATH"
      - name: Check terminal presentation
        if: ${{ steps.inputs.outputs.kind == 'tool' }}
        uses: showxu/skills/skills/github-readme-design/scripts@e5a50c34bf66264a436288f96e44db9caa305912 # v0.2.0
        with:
          asset: terminal
          command: check
          design: standard/DESIGN.md
          fonts: standard/Brand/Fonts
          assets: caller/${{ inputs.assets }}/terminal
          executable: ${{ runner.temp }}/executable/${{ inputs.executable-path }}
          artifact-dir: ${{ runner.temp }}/presentation/terminal
      - name: Check social preview
        if: ${{ !cancelled() && steps.inputs.outcome == 'success' }}
        uses: showxu/skills/skills/github-readme-design/scripts@e5a50c34bf66264a436288f96e44db9caa305912 # v0.2.0
        with:
          asset: social-preview
          command: check
          design: standard/DESIGN.md
          fonts: standard/Brand/Fonts
          catalog: standard/profile/catalog.json
          repository: ${{ steps.inputs.outputs.repository }}
          icon: ${{ steps.inputs.outputs.icon }}
          assets: caller/${{ inputs.assets }}/social-preview
          artifact-dir: ${{ runner.temp }}/presentation/social-preview
      - name: Archive regenerated presentation assets
        if: ${{ failure() }}
        run: |
          if [[ -d "$RUNNER_TEMP/presentation" ]]; then
            tar -C "$RUNNER_TEMP/presentation" -cf "$RUNNER_TEMP/presentation.tar" .
          fi
      - name: Upload regenerated presentation assets
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presentation
          path: ${{ runner.temp }}/presentation.tar
          if-no-files-found: ignore
