name: CI

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  presentation-fixture:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: presentation-fixture
          path: Tests/Fixtures/Presentation/demo
          if-no-files-found: error
  presentation:
    needs: presentation-fixture
    uses: ./.github/workflows/presentation.yml
    with:
      runner: ubuntu-24.04
      executable-artifact: presentation-fixture
      executable-path: demo
      assets: Tests/Fixtures/Presentation
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint DESIGN.md
        uses: showxu/skills/skills/github-readme-design/scripts@ca4eee1bf838cfa81fa6de3912270c74e47c3e76 # v0.1.0
        with:
          asset: design
          command: lint
          design: DESIGN.md
      - run: python3 -m unittest discover -s Tests
      - run: python3 Scripts/check --public
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: git diff --check
