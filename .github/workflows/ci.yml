name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - run: python3 -m unittest discover -s Tests
      - run: python3 Scripts/check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
