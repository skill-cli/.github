name: CI

on:
  push:
    branches: [master]
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  organization:
    permissions:
      contents: read
    uses: agents-tools/github-workflows/.github/workflows/organization.yml@d0d1fd91e655e6d230cf3d5085c1eb6f5f26d358
    with:
      organization: skill-cli
      declaration-repository: agents-tools/.github
      declaration-revision: 6add3acfbed4e3bfbdb26db19072611772326799
      catalog-repository: ${{ github.repository }}
      catalog-revision: ${{ github.sha }}
      mode: public
  check:
    needs: organization
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Require organization checks to succeed
        env:
          ORGANIZATION_RESULT: ${{ needs.organization.result }}
        run: test "$ORGANIZATION_RESULT" = success
