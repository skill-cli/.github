name: Source policy

on:
  push:
    branches: ['**']
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy:
    permissions:
      contents: read
    uses: agents-tools/.github/.github/workflows/policy.yml@949521dde58022b6780ca7f566e5315f8fad826e
